name: publicar o card do dia

on:
  schedule:
    # O card sai às 6 da manhã em Portugal. O cron do GitHub é sempre em UTC e não
    # segue o horário de verão, que acaba a 25 de outubro, a meio da série — por
    # isso dispara duas vezes e o script escolhe. Em horário de verão serve a das
    # 05:00; de 25 de outubro em diante, a das 06:00. A outra sai sem publicar.
    # A plataforma costuma atrasar-se 5 a 15 minutos, e isso é aceitável aqui.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dia:
        description: "forçar um dia (vazio = o de hoje)"
        required: false
      ensaio:
        description: "só criar o contentor, sem publicar"
        type: boolean
        default: true

permissions:
  contents: write        # para escrever o registo, que também mantém o cron vivo

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: publicar no Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DIA: ${{ inputs.dia }}
          ENSAIO: ${{ inputs.ensaio }}
        run: python3 scripts/publicar_do_dia.py

      - name: guardar o registo
        run: |
          git config user.name  "publicador"
          git config user.email "publicador@users.noreply.github.com"
          git add registo/
          git diff --cached --quiet || git commit -m "registo: $(date -u +%F)"
          git push
